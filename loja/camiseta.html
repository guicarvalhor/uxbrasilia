    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="produto.css" />

    <link rel="icon" type="image/x-icon" href="/assets/favicon/favicon.ico">

<body>
    <div id="menu-container"></div>

    <main class="product-page-wrapper">
    <div class="product-container">
        <section class="product-image-gallery">
            <img id="main-product-image" src="/assets/lojinha/camiseta.png" alt="Imagem principal do produto">
        </section>

        <section class="product-details">
            <h1 id="product-name">Camiseta UXBrasília</h1>
            <p class="price" id="product-price">R$ 60,00</p>
            

            <div class="option-group">
                <label>Tamanho:</label>
                <div class="size-options" id="size-options-container">
                    </div>
            </div>

            <div class="stock-status" id="stock-status">
                </div>

            <div class="product-description">
                <h2>Descrição do Produto</h2>
                <p>Leve o orgulho da comunidade no peito! Nossa camiseta oficial é feita com malha 100% algodão de alta qualidade, garantindo conforto e durabilidade. Design exclusivo e tiragem limitada para membros e apoiadores da UXBrasília.</p>
            </div>

            <div class="action-buttons">
                <button class="btn btn-buy hidden" id="buy-button">Quero Encomendar!</button>
                <p class="sold-out-message hidden" id="sold-out-message">Produto Esgotado</p>
            </div>
        </section>
    </div>
</main>
    <div id="footer-container"></div>
    <script src="/menu-footer.js" defer></script>
    <script src="produto.js"></script>
