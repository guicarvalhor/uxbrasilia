<!doctype html>
<html lang="pt-br">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lojinha — UXBrasília</title>

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cabinet+Grotesk:wght@400;500;700&family=Work+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" type="image/x-icon" href="/assets/favicon/favicon.ico">
    
    <script defer src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/@studio-freight/lenis@1.0.37/bundled/lenis.min.js"></script>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-FWYM4MXY6K"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());

        gtag('config', 'G-FWYM4MXY6K');
    </script>
</head>

<body>
    <div id="menu-container"></div>

    <section class="hero blue" id="hero-voluntariado"> 
            <div class="hero__bg">
            <div class="rings rings--1"></div>
            <div class="rings rings--2"></div>
            <div class="rings rings--3"></div>
            <div class="rings rings--4"></div>
            <div class="rings rings--5"></div>
        </div>
        <div class="container hero__content">
            <h1 class="hero__title">
                Leve pra casa um pedaço da comunidade
            </h1>
            <p class="hero__desc">
                Produtos feitos com carinho para quem faz parte da UXBrasília.
            </p>
        </div>
    </section>
    
    <main class="team" style="border-radius: 0; background-color: var(--offwhite);">
        <div class="container">
            <h2 class="section__title" style="color: var(--blue);">Nossos Produtos</h2>
            <div class="catalog-layout">
                <aside class="catalog-filters" id="catalog-filters">
                    <div class="catalog-filters-header">
                        <h4 class="catalog-filters-title">Filtre por</h4>
                        <hr />
                    </div>
                    <button class="filter-btn active" data-filter="all">Todos</button>
                    <button class="filter-btn" data-filter="camiseta">Camisetas</button>
                    <button class="filter-btn" data-filter="caneca">Canecas</button>
                    <button class="filter-btn" data-filter="cobogo">Cobogós</button>
                </aside>

                <div class="catalog-main">
                    <div class="team__grid" id="catalog-grid">
                        <figure class="team-card" data-category="camiseta">
                            <img src="assets/lojinha/café-ux.png" alt="Camiseta Café e UX/UI"/>
                            <a class="card-link" href="loja/produto.html?id=camiseta-cafe-uxui">Ir ao produto</a>
                            <figcaption>
                                <h3>Camiseta Café e UX/UI</h3>
                                <p>Camiseta temática "Café e UX/UI" — perfeita para encontros e cafés da comunidade.</p>
                                <p style="font-size: 24px; padding:20px 0px; font-weight: 700;">R$ 70,00</p>
                                <a class="btn btn--ghost full" href="loja/produto.html?id=camiseta-cafe-uxui">Ver produto &gt;</a>
                            </figcaption>
                        </figure>

                        <figure class="team-card" data-category="camiseta">
                            <img src="assets/lojinha/oficial.png" alt="Camiseta oficial UXBrasília"/>
                            <a class="card-link" href="loja/produto.html?id=camiseta-uxb">Ir ao produto</a>
                            <figcaption>
                                <h3>Camiseta UXBrasília</h3>
                                <p>A camiseta oficial da comunidade é feita com um algodão de alta qualidade</p>
                                <p style="font-size: 24px; padding:20px 0px; font-weight: 700;">R$ 60,00</p>
                                <a class="btn btn--ghost full" href="loja/produto.html?id=camiseta-uxb">Ver produto &gt;</a>
                            </figcaption>
                        </figure>

                        <figure class="team-card" data-category="cobogo">
                            <img src="assets/lojinha/UXBrasilia.jpg" alt="Cobogó"/>
                            <a class="card-link" href="loja/produto.html?id=cobogo">Ir ao produto</a>
                            <figcaption>
                                <h3>Cobogós</h3>
                                <p>Inspirado nas superquadras de Brasília, este elemento vazado é uma releitura moderna do clássico modernista.</p>
                                <p style="font-size: 24px; padding:20px 0px; font-weight: 700;">R$ 10,00</p> 
                                <a class="btn btn--ghost full"href="loja/produto.html?id=cobogo">Ver produto &gt;</a>
                            </figcaption>
                        </figure>

                        <figure class="team-card" data-category="caneca">
                            <img src="assets/lojinha/caneca.png" alt="Caneca branca com logo UXBrasília"/>
                            <a class="card-link" href="loja/produto.html?id=caneca-comunidade">Ir ao produto</a>
                            <figcaption>
                                <h3>Caneca da Comunidade</h3>
                                <p>Perfeita para o seu café enquanto planeja a sua próxima interface incrível.</p>
                                <p style="font-size: 24px; padding:20px 0px; font-weight: 700;">R$ 15,00</p>
                                <a class="btn btn--ghost full" href="loja/produto.html?id=caneca-comunidade">Ver produto &gt;</a>
                            </figcaption>
                        </figure>
                    </div>
        </div>
    </main>

    <script>
        // Filtros do catálogo
        (function(){
            const filters = document.getElementById('catalog-filters');
            const grid = document.getElementById('catalog-grid');
            if(!filters || !grid) return;

            filters.addEventListener('click', (e) => {
                const btn = e.target.closest('.filter-btn');
                if(!btn) return;
                const filter = btn.dataset.filter;

                // toggle active class
                filters.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');

                const cards = grid.querySelectorAll('.team-card');
                cards.forEach(card => {
                    const cat = card.dataset.category || 'all';
                    if(filter === 'all' || cat === filter) {
                        card.style.display = '';
                    } else {
                        card.style.display = 'none';
                    }
                });
            });
        })();
    </script>

    <div id="footer-container"></div>
    <script src="menu-footer.js" defer></script>

</body>
</html>
