<!doctype html>
<html lang="pt-br">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Blog — UXBrasília</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" type="image/x-icon" href="/assets/favicon/favicon.ico">
    <link
        href="https://fonts.googleapis.com/css2?family=Cabinet+Grotesk:wght@400;500;700&family=Work+Sans:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
</head>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-FWYM4MXY6K"></script>
<script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());

    gtag('config', 'G-FWYM4MXY6K');
</script>
<body>
    <div id="menu-container"></div>

    <main>
  <section id="hero-voluntariado" class="hero">
        <div class="hero__bg">
            <div class="rings rings--1"></div>
            <div class="rings rings--2"></div>
            <div class="rings rings--3"></div>
            <div class="rings rings--4"></div>
            <div class="rings rings--5"></div>
        </div>

        <div class="container hero__content-pink">
            <h1 class="hero__title">
                Nosso blog
            </h1>
            <p class="hero__desc">
                Artigos, dicas e novidades do universo de UX/UI, direto da nossa comunidade.
            </p>
        </div>
    </section>
    <section class="blog-controls">
        <div class="container">
            <div id="blog-filters" class="blog-filters" aria-label="Filtrar posts por categoria"></div>
            <div id="blog-pagination" class="blog-pagination" aria-label="Paginação do blog"></div>
        </div>
    </section>
        <section class="blog-section">
            <div class="container">
                <div class="blog-grid">
                    <!-- Posts carregados dinamicamente via blog-loader.js -->
                </div>
            </div>
        </section>
    </main>
    <div id="footer-container"></div>
    <script src="script.js" defer></script>
    <script src="menu-footer.js" defer></script>
    <script src="/blog/blog-loader.js" defer></script>
</body>

</html>
