<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Blog — UXBrasília</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="icon" type="image/x-icon" href="/assets/favicon/favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Cabinet+Grotesk:wght@400;500;700&family=Work+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<script>

<body>
    <div id="menu-container"></div>

    <main class="post-container">
        <article class="post">
            <header class="post-header">
                <div class="post-meta">
                    <span class="post-category"></span>
                    <span class="post-date"></span>
                </div>
                <h1 class="post-title"></h1>
                <p class="post-subtitle"></p>

            <figure class="post-figure">
                <img src="" alt="">
            </figure>

            <section class="post-content">
                <!-- Conteúdo carregado dinamicamente -->
            </section>
            
            <footer class="post-footer">
                <a href="/blog.html" class="back-to-blog">← Voltar para o Blog</a>
            </footer>
        </article>
    </main>

    <div id="footer-container"></div>
    <script src="/script.js" defer></script>
    <script src="/menu-footer.js" defer></script>
    <script src="/blog/post-loader.js" defer></script>

</html>
