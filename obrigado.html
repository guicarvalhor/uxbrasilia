<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Obrigado — UX Brasília</title>
    <meta name="description" content="Página de confirmação de envio do formulário de vagas da UX Brasília." />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cabinet+Grotesk:wght@400;500;700&family=Work+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css" />
    <style>
        body {
            background: linear-gradient(180deg, #f7f8f7 0%, #ecfdf5 100%);
            color: var(--ink);
        }

        .thanks-shell {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 32px 20px;
            position: relative;
        }

        .loading-state {
            display: grid;
            place-items: center;
            width: min(420px, 100%);
            transition: opacity 0.45s ease, transform 0.45s ease, visibility 0.45s ease;
        }

        .loading-card {
            width: 100%;
            background: rgba(255, 255, 255, 0.92);
            border: 1px solid rgba(56, 178, 111, 0.18);
            border-radius: 28px;
            box-shadow: var(--shadow);
            padding: clamp(28px, 5vw, 40px);
            text-align: center;
        }

        .loader {
            width: 68px;
            height: 68px;
            margin: 0 auto 18px;
            border: 6px solid rgba(56, 178, 111, 0.15);
            border-top-color: var(--green-600);
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loading-title {
            margin: 0 0 8px;
            font-family: "Cabinet Grotesk", system-ui;
            font-size: clamp(1.5rem, 3vw, 2.2rem);
            color: var(--ink);
        }

        .loading-subtitle {
            margin: 0;
            font-size: 0.95rem;
            color: var(--muted);
        }

        .thanks-card {
            width: min(700px, 100%);
            background: rgba(255, 255, 255, 0.92);
            border: 1px solid rgba(56, 178, 111, 0.18);
            border-radius: 28px;
            box-shadow: var(--shadow);
            padding: clamp(28px, 5vw, 52px);
            text-align: center;
            opacity: 0;
            visibility: hidden;
            transform: translateY(18px);
            transition: opacity 0.45s ease, transform 0.45s ease, visibility 0.45s ease;
            position: absolute;
        }

        .thanks-card.is-visible {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
            position: relative;
        }

        .loading-state.is-hidden {
            opacity: 0;
            visibility: hidden;
            transform: scale(0.98);
            pointer-events: none;
            position: absolute;
        }

        .thanks-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: rgba(56, 178, 111, 0.12);
            color: var(--green-600);
            border-radius: 999px;
            padding: 10px 18px;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            font-size: 0.72rem;
            margin-bottom: 18px;
        }

        .thanks-card h1 {
            font-family: "Cabinet Grotesk", system-ui;
            font-size: clamp(2.1rem, 4vw, 3.5rem);
            line-height: 1.08;
            letter-spacing: -0.04em;
            margin: 0 0 16px;
            color: var(--ink);
        }

        .thanks-card p {
            max-width: 560px;
            margin: 0 auto 24px;
            font-size: 1.05rem;
            line-height: 1.7;
            color: var(--muted);
        }

        .thanks-actions {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .thanks-actions .btn {
            min-width: 210px;
        }
    </style>
</head>
<body>
    <main class="thanks-shell">
        <div id="loadingState" class="loading-state" aria-live="polite" aria-label="Enviando candidatura">
            <div class="loading-card">
                <div class="loader" aria-hidden="true"></div>
                <p class="loading-title">Enviando sua candidatura...</p>
                <p class="loading-subtitle">Estamos validando os seus dados.</p>
            </div>
        </div>

        <section id="thanksCard" class="thanks-card" aria-labelledby="thanks-title">
            <div class="thanks-badge">Formulário enviado</div>
            <h1 id="thanks-title">Obrigado pela sua candidatura!</h1>
            <p>
                Sua inscrição foi enviada com sucesso. A nossa equipe vai analisar seu interesse e entraremos em contato em breve.
            </p>
            <div class="thanks-actions">
                <a href="/index.html" class="btn btn--primary">Voltar para a página inicial</a>
                <a href="/vagas.html" class="btn btn--ghost">Ver outras oportunidades</a>
            </div>
        </section>
    </main>

    <script>
        const loadingState = document.getElementById('loadingState');
        const thanksCard = document.getElementById('thanksCard');

        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                loadingState.classList.add('is-hidden');
                thanksCard.classList.add('is-visible');
            }, 1800);
        });
    </script>
</body>
</html>
